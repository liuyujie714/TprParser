name: TprParser

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: get source
      uses: actions/checkout@v2

    - name: set python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8.0'

    - name: build job
      run: |
        set -x
        python -m pip install numpy
        cd TprParser
        cmake . -DCMAKE_BUILD_TYPE=Release
        make 
        make install 


