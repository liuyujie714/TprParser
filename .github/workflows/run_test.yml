name: TprParser

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Create build directory
      run: mkdir ${GITHUB_WORKSPACE}/build

    - name: Configure CMake
      working-directory: ${GITHUB_WORKSPACE}/build
      run: |
        set -x
        cmake ..

    - name: Build project
      working-directory: ${GITHUB_WORKSPACE}/build
      run: |
        set -x
        cmake --build .
