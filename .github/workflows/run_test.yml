name: TprParser

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: get source
      uses: actions/checkout@v2

    - name: set python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8.0'
      run: python -m pip install numpy

    - name: build job
      run: |
        set -x
        cd TprParser
        cmake . -DCMAKE_BUILD_TYPE=Release
        make 
        make install 


