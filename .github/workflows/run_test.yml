name: TprParser

on:
  push:
    branches:
      - master
  # schedule:
  #   - cron: '0 1 * * *'  # 01:00 trigger

    
jobs:
  UbuntuLinux:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./TprParser

    steps:
    - name: git source
      uses: actions/checkout@v2

    - name: set python version
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: build job by cmake
      run: |
        set -x
        python -m pip install numpy
        cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$(pwd)
        make 
        make install 

    - name: build job by setup.py
      run: |
        set -x
        python setup.py build
        python setup.py install

    - name: Tests
      run:
        python TprParser/TestTprReader.py

  RockyLinux:
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9
    defaults:
      run:
        working-directory: ./TprParser

    steps:
    - name: git source
      uses: actions/checkout@v2

    - name: set python and gcc env
      run: |
        set -x
        dnf install gcc gcc-c++ cmake python3 -y
        ln -sf /usr/bin/python3 /usr/bin/python
        pip install numpy

    - name: build job by cmake
      run: |
        set -x 
        cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$(pwd)
        make 
        make install 

    - name: build job by setup.py
      run: |
        python setup.py build
        python setup.py install
    
    - name: Tests
      run: 
        python TprParser/TestTprReader.py

  WindowsBuild:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./TprParser

    steps:
    - name: git source
      uses: actions/checkout@v2

    - name: set python version
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: build job by cmake
      run: |
        python -m pip install numpy
        cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$(pwd)
        cmake --build . --target INSTALL --config Release

    - name: build job by setup.py
      run: |
        python setup.py build
        python setup.py install

    - name: Tests
      run: 
        python TprParser/TestTprReader.py


  Mingw64Build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./TprParser

    steps:
    - name: git source
      uses: actions/checkout@v2

    - name: Set up Msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
        pacboy: >-
          toolchain:p
          cmake:p

    - name: set python version
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: build job by cmake
      run: |
        python -m pip install numpy
        cmake . -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" -DCMAKE_INSTALL_PREFIX=$(pwd)
        make 
        make install

    - name: build job by setup.py
      run: |
        python setup.py build
        python setup.py install

    - name: Tests
      run: 
        python TprParser/TestTprReader.py
